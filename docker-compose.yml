name: network

services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin
    ports:
      - "8080:80"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "8081:80"

  api:
    build:
      context: ./server/api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8021:80"
